services:
  - type: web
    name: apartment-tracker-agoda-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOSTAWAY_ACCOUNT_ID
        sync: false
      - key: HOSTAWAY_API_KEY
        sync: false
      - key: AGODA_PLACEHOLDER_PHONES
        value: "+9712035640799"
